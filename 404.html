<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面不存在 · 拾光</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("shiguang-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/index.html">拾光</a>
        <nav class="site-nav" aria-label="主导航">
          <a href="/index.html">文章</a>
          <a href="/about.html">关于</a>
          <button class="theme-toggle" type="button" aria-label="切换深浅色">☾</button>
        </nav>
      </div>
    </header>

    <main id="main">
      <div class="wrap center">
        <div>
          <p class="code">404</p>
          <h1 style="font-family: var(--font-serif); margin: 1rem 0 0.5rem">这一页不见了</h1>
          <p style="color: var(--muted); margin-top: 0">
            可能是链接打错，也可能是文章被我挪走了。
          </p>
          <p><a href="/index.html">← 回到首页</a></p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span>© 2026 阿舟</span>
      </div>
    </footer>

    <script src="/assets/app.js"></script>
  </body>
</html>
